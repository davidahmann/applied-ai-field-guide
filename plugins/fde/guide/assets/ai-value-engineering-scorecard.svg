<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 1224" role="img" aria-labelledby="title description">
  <title id="title">AI Value Engineering Scorecard</title>
  <desc id="description">A one-page scorecard with twelve AI value-engineering factors, four hard gates, and a zero-to-two evidence scale.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2a"/>
      <stop offset="1" stop-color="#12314a"/>
    </linearGradient>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { fill: #65d8c2; font-size: 20px; font-weight: 700; letter-spacing: 3px; }
      .title { fill: #ffffff; font-size: 52px; font-weight: 720; }
      .subtitle { fill: #c9dde8; font-size: 24px; }
      .gate-label { fill: #9db5c3; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
      .gate-title { fill: #ffffff; font-size: 21px; font-weight: 700; }
      .group { fill: #102635; font-size: 19px; font-weight: 750; letter-spacing: 1px; }
      .factor { fill: #102635; font-size: 19px; font-weight: 680; }
      .factor-sub { fill: #556a78; font-size: 15px; }
      .number { fill: #ffffff; font-size: 18px; font-weight: 760; text-anchor: middle; dominant-baseline: central; }
      .footer-title { fill: #ffffff; font-size: 20px; font-weight: 700; }
      .footer { fill: #c9dde8; font-size: 17px; }
    </style>
  </defs>

  <rect width="1584" height="1224" fill="#f5f8fa"/>
  <rect width="1584" height="276" fill="url(#background)"/>
  <g class="sans">
    <text x="64" y="60" class="eyebrow">THE FDE GUIDE</text>
    <text x="64" y="122" class="title">AI Value Engineering Scorecard</text>
    <text x="64" y="164" class="subtitle">12 factors. 4 hard gates. One outcome: accepted value.</text>

    <g transform="translate(64 194)">
      <rect width="348" height="62" rx="10" fill="#102d3f" stroke="#3e6377"/>
      <text x="18" y="23" class="gate-label">HARD GATE 1</text>
      <text x="18" y="48" class="gate-title">Owned outcome</text>
    </g>
    <g transform="translate(433 194)">
      <rect width="348" height="62" rx="10" fill="#102d3f" stroke="#3e6377"/>
      <text x="18" y="23" class="gate-label">HARD GATE 2</text>
      <text x="18" y="48" class="gate-title">Independent verifier</text>
    </g>
    <g transform="translate(802 194)">
      <rect width="348" height="62" rx="10" fill="#102d3f" stroke="#3e6377"/>
      <text x="18" y="23" class="gate-label">HARD GATE 3</text>
      <text x="18" y="48" class="gate-title">Bounded authority and loss</text>
    </g>
    <g transform="translate(1171 194)">
      <rect width="349" height="62" rx="10" fill="#102d3f" stroke="#3e6377"/>
      <text x="18" y="23" class="gate-label">HARD GATE 4</text>
      <text x="18" y="48" class="gate-title">Positive value after full cost</text>
    </g>

    <g transform="translate(64 310)">
      <rect width="560" height="720" rx="16" fill="#ffffff" stroke="#d6e0e6"/>
      <rect width="560" height="58" rx="16" fill="#d9f2ec"/>
      <path d="M0 42h560v16H0z" fill="#d9f2ec"/>
      <text x="24" y="37" class="group">UNDERSTAND THE WORK</text>

      <g transform="translate(24 88)"><circle cx="20" cy="20" r="20" fill="#137f70"/><text x="20" y="20" class="number">1</text><text x="56" y="17" class="factor">Observe the real work</text><text x="56" y="41" class="factor-sub">Actors, decisions, exceptions, recovery</text></g>
      <line x1="24" y1="155" x2="536" y2="155" stroke="#e2e9ed"/>
      <g transform="translate(24 178)"><circle cx="20" cy="20" r="20" fill="#137f70"/><text x="20" y="20" class="number">2</text><text x="56" y="17" class="factor">Own the outcome</text><text x="56" y="41" class="factor-sub">Accepted result, target, source, owner</text></g>
      <line x1="24" y1="245" x2="536" y2="245" stroke="#e2e9ed"/>
      <g transform="translate(24 268)"><circle cx="20" cy="20" r="20" fill="#137f70"/><text x="20" y="20" class="number">3</text><text x="56" y="17" class="factor">Bound the eligible work</text><text x="56" y="41" class="factor-sub">Population, exclusions, denominator</text></g>
      <line x1="24" y1="335" x2="536" y2="335" stroke="#e2e9ed"/>
      <g transform="translate(24 358)"><circle cx="20" cy="20" r="20" fill="#137f70"/><text x="20" y="20" class="number">4</text><text x="56" y="17" class="factor">Establish the counterfactual</text><text x="56" y="41" class="factor-sub">Baseline, comparison, confounders</text></g>
      <line x1="24" y1="425" x2="536" y2="425" stroke="#e2e9ed"/>
      <g transform="translate(24 448)"><circle cx="20" cy="20" r="20" fill="#137f70"/><text x="20" y="20" class="number">5</text><text x="56" y="17" class="factor">Name the verifier</text><text x="56" y="41" class="factor-sub">Independent acceptance and rejection</text></g>

      <rect x="24" y="548" width="512" height="142" rx="12" fill="#f3f7f9"/>
      <text x="44" y="580" class="group">EVIDENCE SCALE</text>
      <text x="44" y="616" class="factor">0 - Undefined</text>
      <text x="222" y="616" class="factor">1 - Declared</text>
      <text x="388" y="616" class="factor">2 - Demonstrated</text>
      <text x="44" y="654" class="factor-sub">Scores expose evidence gaps. They are not a certification or pass mark.</text>
    </g>

    <g transform="translate(646 310)">
      <rect width="874" height="720" rx="16" fill="#ffffff" stroke="#d6e0e6"/>
      <rect width="874" height="58" rx="16" fill="#e6f0f8"/>
      <path d="M0 42h874v16H0z" fill="#e6f0f8"/>
      <text x="24" y="37" class="group">DESIGN, PROVE, AND OPERATE</text>

      <g transform="translate(24 88)"><circle cx="20" cy="20" r="20" fill="#286da8"/><text x="20" y="20" class="number">6</text><text x="56" y="17" class="factor">Engineer the workflow and adoption</text><text x="56" y="41" class="factor-sub">Use, review, support, override, recover</text></g>
      <g transform="translate(454 88)"><circle cx="20" cy="20" r="20" fill="#286da8"/><text x="20" y="20" class="number">7</text><text x="56" y="17" class="factor">Use the smallest sufficient intelligence</text><text x="56" y="41" class="factor-sub">Rules, ML, models, agents, or people</text></g>
      <line x1="24" y1="155" x2="850" y2="155" stroke="#e2e9ed"/>
      <g transform="translate(24 178)"><circle cx="20" cy="20" r="20" fill="#286da8"/><text x="20" y="20" class="number">8</text><text x="56" y="17" class="factor">Bound authority and loss</text><text x="56" y="41" class="factor-sub">Permissions, effects, recovery, stop</text></g>
      <g transform="translate(454 178)"><circle cx="20" cy="20" r="20" fill="#286da8"/><text x="20" y="20" class="number">9</text><text x="56" y="17" class="factor">Price the whole service</text><text x="56" y="41" class="factor-sub">Lifecycle cost per accepted outcome</text></g>
      <line x1="24" y1="245" x2="850" y2="245" stroke="#e2e9ed"/>
      <g transform="translate(24 268)"><circle cx="20" cy="20" r="20" fill="#286da8"/><text x="20" y="20" class="number">10</text><text x="56" y="17" class="factor">Prove it on representative work</text><text x="56" y="41" class="factor-sub">Normal, difficult, adversarial, recovery</text></g>
      <g transform="translate(454 268)"><circle cx="20" cy="20" r="20" fill="#286da8"/><text x="20" y="20" class="number">11</text><text x="56" y="17" class="factor">Measure attributable realized value</text><text x="56" y="41" class="factor-sub">Adoption, acceptance, cost, loss</text></g>
      <line x1="24" y1="335" x2="850" y2="335" stroke="#e2e9ed"/>
      <g transform="translate(24 358)"><circle cx="20" cy="20" r="20" fill="#286da8"/><text x="20" y="20" class="number">12</text><text x="56" y="17" class="factor">Expand, constrain, or retire from evidence</text><text x="56" y="41" class="factor-sub">Decide from evidence and reversal conditions</text></g>

      <rect x="24" y="468" width="826" height="222" rx="12" fill="#f3f7f9"/>
      <text x="44" y="506" class="group">DECISION RULE</text>
      <text x="44" y="544" class="factor">If any hard gate is fail or unknown:</text>
      <text x="44" y="578" class="factor-sub">Do not recommend pilot or continue. Defer, do not build, constrain, pause,</text>
      <text x="44" y="602" class="factor-sub">or retire - and name the evidence that would change the decision.</text>
      <text x="44" y="644" class="factor">All gates passing is necessary, not sufficient.</text>
      <text x="44" y="672" class="factor-sub">Target policy, release evidence, accountable owners, and local approval still control.</text>
    </g>

    <rect y="1064" width="1584" height="160" fill="#071a2a"/>
    <text x="64" y="1110" class="footer-title">Tokens are inputs. Autonomy is a design choice. Accepted outcomes are the product.</text>
    <text x="64" y="1146" class="footer">Framework: The 12 Factors of AI Value Engineering</text>
    <text x="64" y="1178" class="footer">Worksheet and full guide: davidahmann.github.io/fde-guide/ai-value-engineering-scorecard/</text>
    <text x="1520" y="1178" text-anchor="end" class="footer">Apache-2.0</text>
  </g>
</svg>
