<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">The Applied AI Field Guide — From real work to production</title>
  <desc id="description">Open-source guidance for understanding the work, choosing the right mechanism, proving the outcome, and operating the system.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#071a2a" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#071a2a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#f5f4ef"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="18" height="640" fill="#22a990"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(72 64)">
      <rect width="306" height="42" rx="21" fill="#071a2a"/>
      <circle cx="24" cy="21" r="6" fill="#54d6bb"/>
      <text x="44" y="27" fill="#f5f4ef" font-size="15" font-weight="750" letter-spacing="1.8">FREE &amp; OPEN SOURCE</text>
    </g>

    <text x="72" y="196" fill="#071a2a" font-size="88" font-weight="820" letter-spacing="-3.6">
      <tspan x="72" dy="0">The Applied AI</tspan>
      <tspan x="72" dy="94">Field Guide.</tspan>
    </text>

    <text x="76" y="365" fill="#415867" font-size="25" font-weight="470">
      Find the right problem. Build, prove, and operate the system.
    </text>

    <g transform="translate(72 432)" filter="url(#shadow)">
      <rect width="1136" height="116" rx="14" fill="#ffffff" stroke="#cbd6dc"/>
      <path d="M274 58H298M554 58H578M834 58H858" fill="none" stroke="#22a990" stroke-width="3" stroke-linecap="round"/>
      <path d="m290 50 8 8-8 8M570 50l8 8-8 8M850 50l8 8-8 8" fill="none" stroke="#22a990" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(28 24)">
        <rect width="236" height="68" rx="9" fill="#edf1f2"/>
        <text x="18" y="25" fill="#6b7c86" font-size="13" font-weight="750" letter-spacing="1.5">FIELDWORK</text>
        <text x="18" y="51" fill="#071a2a" font-size="18" font-weight="720">Understand the work</text>
      </g>
      <g transform="translate(308 24)">
        <rect width="236" height="68" rx="9" fill="#e5f5f1"/>
        <text x="18" y="25" fill="#247c6b" font-size="13" font-weight="750" letter-spacing="1.5">ENGINEERING</text>
        <text x="18" y="51" fill="#071a2a" font-size="18" font-weight="720">Choose the mechanism</text>
      </g>
      <g transform="translate(588 24)">
        <rect width="236" height="68" rx="9" fill="#d9f2ec"/>
        <text x="18" y="25" fill="#247c6b" font-size="13" font-weight="750" letter-spacing="1.5">EVIDENCE</text>
        <text x="18" y="51" fill="#071a2a" font-size="18" font-weight="720">Prove the outcome</text>
      </g>
      <g transform="translate(868 24)">
        <rect width="240" height="68" rx="9" fill="#071a2a"/>
        <text x="18" y="25" fill="#83dccb" font-size="13" font-weight="750" letter-spacing="1.5">OPERATIONS</text>
        <text x="18" y="51" fill="#ffffff" font-size="18" font-weight="720">Operate the system</text>
      </g>
    </g>

    <text x="76" y="598" fill="#071a2a" font-size="17" font-weight="720" letter-spacing="0.8">A PRACTICAL DELIVERY KIT</text>
    <text x="1208" y="598" fill="#526a78" font-size="17" font-weight="540" text-anchor="end">github.com/davidahmann/applied-ai-field-guide</text>
  </g>
</svg>
